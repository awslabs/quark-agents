[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quark-agents"
version = "0.4.0"
description = "Minimal Python agentic framework — async-first, stateless, with built-in quota management via Reactor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "litellm>=1.0.0",
]

[project.optional-dependencies]
bedrock = [
    "boto3>=1.28.0",
]
otel = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]
mcp = [
    "mcp>=1.0.0",
]
reactor = []
ray = [
    "ray[default]>=2.0.0",
]
all = [
    "boto3>=1.28.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "mcp>=1.0.0",
    "ray[default]>=2.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "ray[default]>=2.0.0",
    "tenacity>=8.0.0",
]

[tool.setuptools]
py-modules = ["quark", "quark_reactor", "quark_mcp", "quark_ray"]
