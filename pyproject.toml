[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "quark"
version = "0.1.0"
description = "A ~200-line Python agentic framework with Airflow-style >> pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "litellm>=1.0.0",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[tool.setuptools]
py-modules = ["quark"]
