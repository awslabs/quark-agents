site_name: Quark Agents
site_description: Minimal Python framework for composing agents, tools, and multi-agent workflows
site_url: https://awslabs.github.io/quark-agents
repo_url: https://github.com/awslabs/quark-agents
repo_name: awslabs/quark-agents

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
  icon:
    logo: fontawesome/solid/atom
  favicon: https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/svgs/solid/atom.svg
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.code.annotate

extra_javascript:
  - https://unpkg.com/mermaid/dist/mermaid.min.js

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - attr_list

nav:
  - Home: index.md
  - Getting Started: quickstart.md
  - Agents: agents.md
  - Pipelines: pipelines.md
  - Providers: providers.md
  - Observability: observability.md
  - Use with MCP: mcp.md
  - API Reference: reference.md
  - Framework Comparison: comparison.md
